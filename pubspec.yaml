name: delivery_route_optimizer
description: A delivery route optimization app

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.13.0
  flutter_polyline_points: ^2.1.0
  geolocator: ^12.0.0
  intl: ^0.19.0
  http: ^1.2.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.5.0  # Add this for actual map implementation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
